<section
  class="header-wrapper"
  style="
    padding: 0;
    margin: 0;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;
  "
>
  <!-- MAIN HEADER -->
  <header class="main-header">
    <div class="header-container">
      <!-- LEFT LOGO + TITLE -->
      <div class="brand-section">
        <div class="school-logo">UDCS</div>
        <div>
          <h2 class="header-title" style="margin-bottom: 2px">
            <strong>Usha Devi Convent School</strong>
          </h2>
          <h1
            class="mobile-hide header-subtitle"
            style="
              margin: 0;
              text-transform: uppercase;
              font-weight: 700;
              letter-spacing: 1px;
            "
          >
            Classes 1 to 5
          </h1>
        </div>
      </div>

      <!-- NAVIGATION -->
      <nav class="main-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        <a routerLink="/about" routerLinkActive="active">About Us</a>
        <a routerLink="/institute" routerLinkActive="active">Institute</a>
        <a routerLink="/gallery" routerLinkActive="active">Gallery</a>
        <a routerLink="/contact" routerLinkActive="active">Contact</a>
        <a
          routerLink="/portal"
          class="btn-primary-custom"
          style="text-transform: none; font-size: 14px"
          >Student Portal</a
        >
      </nav>
    </div>
  </header>
</section>
